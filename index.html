<!DOCTYPE html>
<!-- Declara o tipo de documento como HTML5 -->
<html lang="pt-BR">
<!-- Define o idioma da página como português do Brasil -->

<head>
    <!-- Codificação de caracteres para exibir acentos corretamente -->
    <meta charset="UTF-8">
    <!-- Configura a viewport para design responsivo em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece na aba do navegador -->
    <title>Personagens Rick and Morty</title>
    <!-- Importa a fonte Montserrat do Google Fonts para estética moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Vincula o arquivo de estilos CSS externo -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Cabeçalho da página -->
    <header class="header">
        <!-- Título principal visível ao usuário -->
        <h1>Rick and Morty</h1>
        <!-- Subtítulo explicativo -->
        <p>Personagens do desenho que marcou os anos 2000</p>
    </header>

    <!-- Área principal da página -->
    <main class="conteudo-principal">

        <!-- ============================================
             BARRA DE BUSCA
             Permite localizar personagens pelo nome.
             ============================================ -->
        <section class="barra-busca">
            <!-- Campo de texto para digitar o nome do personagem -->
            <input type="text" id="input-busca" placeholder="Buscar personagem pelo nome...">
            <!-- Botão que dispara a busca -->
            <button id="btn-buscar">Buscar</button>
            <!-- Botão que limpa o filtro e volta à listagem completa -->
            <button id="btn-limpar">Limpar</button>
        </section>

        <!-- ============================================
             CONTAINER DE CARDS
             Os cards NÃO são escritos aqui no HTML.
             Eles são criados dinamicamente via JavaScript.
             ============================================ -->
        <div id="container-cards" class="container-cards"></div>

        <!-- ============================================
             CONTROLES DE PAGINAÇÃO
             Permitem navegar entre as páginas da API.
             ============================================ -->
        <section class="paginacao">
            <!-- Botão para voltar uma página -->
            <button id="btn-anterior" disabled>Anterior</button>
            <!-- Texto que mostra a página atual e o total -->
            <span id="info-pagina">Página 1</span>
            <!-- Botão para avançar uma página -->
            <button id="btn-proximo">Próxima</button>
        </section>

    </main>

    <!-- Rodapé com créditos -->
    <footer class="footer">
        <!-- Texto de rodapé -->
        <p>Projeto acadêmico — UniFECAF — Consumo da API Rick and Morty</p>
        <p>Desenvolvido por Wellington Diego</p>
        <p>2026</p>
    </footer>

    <!-- Vincula o arquivo JavaScript ao final do body para garantir que o DOM já esteja carregado -->
    <script src="js/script.js"></script>
</body>
</html>
